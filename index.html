<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0C447C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PAHMC">
<meta name="description" content="President Abdul Hamid Medical College — Notice Board & Class Routine">
<title>PAHMC App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;min-height:100vh}
.header{background:#0C447C;color:white;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.logo{width:38px;height:38px;border-radius:50%;background:white;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain}
.college-info{flex:1;min-width:0}
.college-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.college-sub{font-size:10px;opacity:.75}
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;opacity:.85;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:#5DCAA5;flex-shrink:0}
.dot.loading{background:#FAC775;animation:blink 1s infinite}
.dot.error{background:#F09595}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;background:white;border-bottom:1px solid #e8edf2;position:sticky;top:62px;z-index:99}
.tab{flex:1;padding:12px 8px;font-size:13px;font-weight:500;color:#666;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{color:#0C447C;border-bottom-color:#0C447C}
.tab svg{width:16px;height:16px}
.content{padding:12px;max-width:600px;margin:0 auto}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid #dde3ea;background:white;color:#555;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.chip.active{background:#0C447C;color:white;border-color:#0C447C}
.notice-list{display:flex;flex-direction:column;gap:10px}
.card{background:white;border-radius:12px;padding:14px 16px;border-left:3px solid #378ADD;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.card.exam{border-left-color:#BA7517}
.card.holiday{border-left-color:#3B6D11}
.card.emergency{border-left-color:#A32D2D}
.card.general{border-left-color:#185FA5}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-title{font-size:14px;font-weight:600;color:#1a2330;line-height:1.3}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;font-weight:500}
.badge.exam{background:#FAEEDA;color:#633806}
.badge.holiday{background:#EAF3DE;color:#173404}
.badge.emergency{background:#FCEBEB;color:#501313}
.badge.general{background:#E6F1FB;color:#042C53}
.card-body{font-size:13px;color:#4a5568;line-height:1.6;margin-bottom:8px}
.card-date{font-size:11px;color:#888}
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:#0C447C;color:white;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(12,68,124,0.4);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.93)}
.batch-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.batch-row::-webkit-scrollbar{display:none}
.batch-chip{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid #dde3ea;background:white;color:#555;cursor:pointer;white-space:nowrap;font-family:inherit}
.batch-chip.active{background:#0C447C;color:white;border-color:#0C447C}
.routine-wrap{overflow-x:auto;border-radius:12px;background:white;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.routine-table{width:100%;border-collapse:collapse;min-width:420px}
.routine-table th{background:#0C447C;color:white;font-size:11px;font-weight:600;padding:8px 6px;text-align:center}
.routine-table th:first-child{text-align:left;padding-left:10px;min-width:80px}
.routine-table td{font-size:11px;padding:8px 6px;text-align:center;border-bottom:1px solid #f0f3f7;color:#333}
.routine-table td:first-child{font-weight:500;color:#555;text-align:left;padding-left:10px;font-size:10px}
.routine-table tr:last-child td{border-bottom:none}
.subj{display:inline-block;padding:3px 7px;border-radius:6px;font-weight:500;font-size:10px}
.subj.anatomy{background:#EEEDFE;color:#3C3489}
.subj.physiology{background:#E1F5EE;color:#085041}
.subj.biochem{background:#FAEEDA;color:#633806}
.subj.pathology{background:#FAECE7;color:#4A1B0C}
.subj.pharma{background:#EAF3DE;color:#173404}
.subj.micro{background:#FBEAF0;color:#4B1528}
.subj.medicine{background:#E6F1FB;color:#042C53}
.subj.surgery{background:#FCEBEB;color:#501313}
.subj.free{color:#aaa}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;padding:20px 20px 32px;width:100%;max-width:600px}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:16px;font-weight:600;color:#1a2330;margin-bottom:16px}
.modal label{font-size:12px;color:#555;display:block;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid #dde3ea;border-radius:10px;font-size:14px;font-family:inherit;color:#1a2330;background:white;outline:none}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:#0C447C}
.modal textarea{min-height:80px;resize:vertical}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-cancel{flex:1;padding:12px;border:1px solid #dde3ea;border-radius:10px;background:white;color:#555;font-size:14px;cursor:pointer;font-family:inherit}
.btn-save{flex:2;padding:12px;border:none;border-radius:10px;background:#0C447C;color:white;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save:disabled{opacity:.5}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:13px}
.skeleton{background:#eef0f3;border-radius:12px;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
.error-box{background:#FFF3F3;color:#8B0000;border:1px solid #fcc;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:12px}
.section{display:none}
.section.show{display:block}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <img src="https://pahmc.edu.bd/wp-content/uploads/2023/09/cropped-pahmch_logo2-1-270x270.png" alt="PAHMC">
  </div>
  <div class="college-info">
    <div class="college-name">President Abdul Hamid Medical College</div>
    <div class="college-sub">Kishoreganj, Bangladesh</div>
  </div>
  <div class="sync-indicator">
    <div class="dot loading" id="dot"></div>
    <span id="sync-txt">লোড...</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('notice',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Notice Board
  </button>
  <button class="tab" onclick="switchTab('routine',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Class Routine
  </button>
</div>

<div class="content">
  <div id="notice-section" class="section show">
    <div id="notice-error" class="error-box" style="display:none"></div>
    <div class="filter-row">
      <button class="chip active" onclick="filterNotice('all',this)">সব</button>
      <button class="chip" onclick="filterNotice('exam',this)">পরীক্ষা</button>
      <button class="chip" onclick="filterNotice('holiday',this)">ছুটি</button>
      <button class="chip" onclick="filterNotice('emergency',this)">জরুরি</button>
      <button class="chip" onclick="filterNotice('general',this)">সাধারণ</button>
    </div>
    <div class="notice-list" id="notice-list">
      <div class="skeleton" style="height:90px;margin-bottom:10px"></div>
      <div class="skeleton" style="height:90px;margin-bottom:10px"></div>
      <div class="skeleton" style="height:90px"></div>
    </div>
  </div>

  <div id="routine-section" class="section">
    <div id="routine-error" class="error-box" style="display:none"></div>
    <div class="batch-row">
      <button class="batch-chip active" onclick="switchBatch('1st',this)">1st Year</button>
      <button class="batch-chip" onclick="switchBatch('2nd',this)">2nd Year</button>
      <button class="batch-chip" onclick="switchBatch('3rd',this)">3rd Year</button>
      <button class="batch-chip" onclick="switchBatch('4th',this)">4th Year</button>
      <button class="batch-chip" onclick="switchBatch('5th',this)">Final Year</button>
    </div>
    <div class="routine-wrap">
      <table class="routine-table" id="routine-table">
        <thead><tr><th>সময়</th><th>রবি</th><th>সোম</th><th>মঙ্গল</th><th>বুধ</th><th>বৃহ</th><th>শুক্র</th></tr></thead>
        <tbody id="routine-body"><tr><td colspan="7" style="padding:24px;text-align:center;color:#aaa;font-size:12px">লোড হচ্ছে...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()" id="fab">+</button>

<div class="modal-bg" id="modal-bg" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>নতুন নোটিশ যোগ করুন</h3>
    <label>শিরোনাম *</label>
    <input type="text" id="n-title" placeholder="নোটিশের বিষয়">
    <label>বিস্তারিত</label>
    <textarea id="n-body" placeholder="বিস্তারিত লিখুন..."></textarea>
    <label>ক্যাটাগরি</label>
    <select id="n-cat">
      <option value="general">সাধারণ</option>
      <option value="exam">পরীক্ষা</option>
      <option value="holiday">ছুটি</option>
      <option value="emergency">জরুরি</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
      <button class="btn-save" id="save-btn" onclick="saveNotice()">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxmHnYI9QAEVSVFs6ruVVt8frI2Sbs79nhuJqjp-PckcqZe86705nToPBfm5tO9LfF0Ow/exec';
const catLabel={exam:'পরীক্ষা',holiday:'ছুটি',emergency:'জরুরি',general:'সাধারণ'};
const colorMap={Anatomy:'anatomy',Physiology:'physiology',Biochem:'biochem',Pathology:'pathology',Pharma:'pharma',Micro:'micro',Medicine:'medicine',Surgery:'surgery',Free:'free'};
const days=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র'];
let allNotices=[],currentFilter='all',currentBatch='1st',currentTab='notice';

function setSyncStatus(s){
  const dot=document.getElementById('dot'),txt=document.getElementById('sync-txt');
  dot.className='dot';
  if(s==='loading'){dot.classList.add('loading');txt.textContent='লোড...';}
  else if(s==='ok'){txt.textContent='Live ✓';}
  else{dot.classList.add('error');txt.textContent='Error';}
}

// JSONP fetch — CORS সমস্যা নেই
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now();
    const script=document.createElement('script');
    window[cb]=function(data){resolve(data);delete window[cb];script.remove();};
    script.onerror=()=>{reject(new Error('JSONP failed'));delete window[cb];script.remove();};
    script.src=url+'&callback='+cb;
    document.head.appendChild(script);
    setTimeout(()=>{if(window[cb]){reject(new Error('Timeout'));delete window[cb];script.remove();}},10000);
  });
}

async function fetchNotices(){
  setSyncStatus('loading');
  try{
    const data=await jsonp(API+'?action=getNotices');
    if(Array.isArray(data)){
      allNotices=data;
      renderNotices();
      setSyncStatus('ok');
      document.getElementById('notice-error').style.display='none';
    } else throw new Error('bad data');
  }catch(e){
    setSyncStatus('error');
    document.getElementById('notice-error').style.display='block';
    document.getElementById('notice-error').textContent='Sheets থেকে লোড হয়নি। Apps Script নতুন করে deploy করো।';
    document.getElementById('notice-list').innerHTML='<div class="empty">📭 কোনো নোটিশ নেই</div>';
  }
}

async function fetchRoutine(batch){
  document.getElementById('routine-body').innerHTML='<tr><td colspan="7" style="padding:24px;text-align:center;color:#aaa;font-size:12px">লোড হচ্ছে...</td></tr>';
  try{
    const data=await jsonp(API+'?action=getRoutine&batch='+encodeURIComponent(batch));
    if(Array.isArray(data)&&data.length){
      renderRoutine(data);
      document.getElementById('routine-error').style.display='none';
    } else {
      document.getElementById('routine-error').style.display='block';
      document.getElementById('routine-error').textContent=batch+' batch-এর routine data নেই।';
      document.getElementById('routine-body').innerHTML='<tr><td colspan="7" style="padding:24px;text-align:center;color:#aaa">কোনো data নেই</td></tr>';
    }
  }catch{
    document.getElementById('routine-error').style.display='block';
    document.getElementById('routine-error').textContent='Routine লোড হয়নি।';
  }
}

function renderNotices(){
  const list=document.getElementById('notice-list');
  const filtered=currentFilter==='all'?allNotices:allNotices.filter(n=>n.category===currentFilter);
  if(!filtered.length){list.innerHTML='<div class="empty">📭 কোনো নোটিশ নেই</div>';return;}
  list.innerHTML=filtered.map(n=>`
    <div class="card ${n.category||'general'}">
      <div class="card-top">
        <div class="card-title">${n.title}</div>
        <span class="badge ${n.category||'general'}">${catLabel[n.category]||'সাধারণ'}</span>
      </div>
      <div class="card-body">${n.body||''}</div>
      <div class="card-date">🕐 ${n.date||''}</div>
    </div>`).join('');
}

function renderRoutine(data){
  const times=[...new Set(data.map(r=>r.time))];
  let html='';
  times.forEach(t=>{
    html+='<tr><td>'+t+'</td>';
    days.forEach(d=>{
      const row=data.find(r=>r.time===t&&r.day===d);
      const subj=row?row.subject:'Free';
      const cls=colorMap[subj]||'free';
      html+=subj==='Free'?'<td><span class="subj free">—</span></td>':`<td><span class="subj ${cls}">${subj}</span></td>`;
    });
    html+='</tr>';
  });
  document.getElementById('routine-body').innerHTML=html||'<tr><td colspan="7" style="padding:24px;text-align:center;color:#aaa">কোনো data নেই</td></tr>';
}

function filterNotice(cat,btn){
  currentFilter=cat;
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderNotices();
}

function switchBatch(batch,btn){
  currentBatch=batch;
  document.querySelectorAll('.batch-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  fetchRoutine(batch);
}

function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('show'));
  document.getElementById(tab+'-section').classList.add('show');
  document.getElementById('fab').style.display=tab==='notice'?'flex':'none';
  if(tab==='routine')fetchRoutine(currentBatch);
}

function openModal(){document.getElementById('modal-bg').classList.add('show');}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');}
function bgClose(e){if(e.target===document.getElementById('modal-bg'))closeModal();}

async function saveNotice(){
  const t=document.getElementById('n-title').value.trim();
  const b=document.getElementById('n-body').value.trim();
  const c=document.getElementById('n-cat').value;
  if(!t){document.getElementById('n-title').focus();return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='সংরক্ষণ হচ্ছে...';
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'addNotice',title:t,body:b,category:c}),headers:{'Content-Type':'application/json'}});
    document.getElementById('n-title').value='';
    document.getElementById('n-body').value='';
    closeModal();
    setTimeout(fetchNotices,2000);
  }catch{alert('সংরক্ষণ ব্যর্থ। আবার চেষ্টা করো।');}
  btn.disabled=false;btn.textContent='সংরক্ষণ করুন';
}

fetchNotices();
</script>
</body>
</html>
